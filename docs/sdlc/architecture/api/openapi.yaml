        currency:
          type: string
        status:
          type: string
        cancellation_policy:
          type: string
        search_tsv:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - organiser_id
      - title
      - start_datetime
      - venue
      - is_free
      - status
      - created_at
    seat:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        row_label:
          type: string
        seat_number:
          type: integer
        price_minor:
          type: integer
        status:
          type: string
      required:
