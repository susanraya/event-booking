spring.application.name=api
# 0.0.0.0 inside a container; HOST=127.0.0.1 keeps a local run off the network.
server.address=${HOST:0.0.0.0}
server.port=${PORT:8000}
# Creates a table or column the entities add; never drops one. Replace with Flyway
# migrations before anything holds data worth keeping.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Quoted, so a table named after an SQL keyword (user, order) still works everywhere --
# names only, never a column's declared type.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true
# A table that cannot be created stops the app, rather than a log line nobody reads: the
# baseline test then fails on a mapping the database refuses.
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true

# Flyway seeds reference data (e.g. the demo organiser); it may run on a fresh database
# before Hibernate's own ddl-auto has created anything, so its migrations are additive
# and tolerate the tables already existing.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# The approved API spec (docs/sdlc/architecture/api/openapi.yaml) names entity-shaped JSON
# fields in snake_case, matching the data model's column names. That is applied per-DTO
# (see app.service.EventResponse and its siblings' @JsonNaming), not globally: the seating
# layout request is the one approved shape that is camelCase ("seatCount"), matching the
# already-built organiser-events screen, so a blanket strategy here would break it.

# Signs organiser session JWTs; set a real secret (32+ chars) in deployment via the
# platform's JWT_SECRET_KEY. SECRET_KEY is public and is never used to sign tokens.
app.jwt.secret=${JWT_SECRET_KEY:dev-only-insecure-jwt-signing-secret-0123456789}
# How long an organiser's JWT stays valid.
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
# NFR-005: activity logs (audit_log) are retained at least 180 days for CERT-In
# expectations; a daily job purges rows older than this.
app.audit.retention-days=${AUDIT_LOG_RETENTION_DAYS:180}

# Booking confirmation/cancellation email (Amazon SES over SMTP, approved architecture).
# A local MailHog/Mailpit-style catch-all is the dev default; deployment supplies the real
# SES SMTP credentials via these platform-provided env vars.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# The address booking/cancellation emails are sent from.
app.mail.from=${MAIL_FROM:no-reply@example.com}
# Where uploaded/generated files (e.g. a cached QR PNG) are written; survives redeploys.
app.media.root=${MEDIA_ROOT:./media}
