spring.application.name=api
# 0.0.0.0 inside a container; HOST=127.0.0.1 keeps a local run off the network.
server.address=${HOST:0.0.0.0}
server.port=${PORT:8000}
# Creates a table or column the entities add; never drops one. Replace with Flyway
# migrations before anything holds data worth keeping.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Quoted, so a table named after an SQL keyword (user, order) still works everywhere --
# names only, never a column's declared type.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true
# A table that cannot be created stops the app, rather than a log line nobody reads: the
# baseline test then fails on a mapping the database refuses.
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true

# Amazon SES over SMTP, Mumbai region, so booking and cancellation email stay inside India.
# Local default points nowhere real; sending is exercised with a fake in tests, never SES.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${SMTP_FROM:bookings@example.com}

# JWT_SECRET_KEY is private and signs organiser session tokens; it is never the same value
# as SECRET_KEY below. The local default is only for a bare run with no platform behind it.
app.jwt.secret=${JWT_SECRET_KEY:dev-only-jwt-secret-change-me-before-any-real-deploy}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:480}

# The shared bearer the generated frontend sends on every call (its own SECRET_KEY, public
# by design). It authenticates "this is our frontend", never signs anything.
app.security.shared-secret=${SECRET_KEY:dev-only-shared-secret}

# Writable directory that survives redeploys; QR ticket images and any other generated media
# live under it.
app.media-root=${MEDIA_ROOT:./data/media}
